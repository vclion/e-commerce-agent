name: commerce-copilot
services:
  db:
    image: commerce-copilot-postgres:16-memory
    build:
      context: .
      dockerfile: backend/docker/postgres.Dockerfile
    environment:
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: commerce
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - commerce_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce -d commerce"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  commerce_data:
