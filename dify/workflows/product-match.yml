app:
  name: WF-Product-Match
  description: 运营商品筛选：按规格、价格与库存查询授权店铺，返回结构化资料。
  mode: workflow
  icon: 🛍️
  icon_type: emoji
  icon_background: '#E8EEE3'
  use_icon_as_answer_icon: false
kind: app
version: 0.7.0
dependencies:
- type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/deepseek:0.0.24@9e12eef09973667f0eaf4f082af883167e1de88740b22e71e71488d020c3778a
workflow:
  conversation_variables: []
  environment_variables:
  - id: eed06488-3929-4cba-a0cf-7b548519d564
    name: TOOL_BASE_URL
    value_type: string
    value: http://host.docker.internal:8000
    description: WSL 本地业务服务
  - id: ed2ea881-e09e-4063-9da7-ef1bf66231a4
    name: TOOL_SERVICE_KEY
    value_type: secret
    value: ''
    description: 从本地 .env 注入
  features:
    file_upload:
      enabled: false
    opening_statement: 描述你的需求，我会基于业务资料帮助你。
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    text_to_speech:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
  graph:
    nodes:
    - id: start
      type: custom
      sourcePosition: right
      targetPosition: left
      position:
        x: 0
        y: 200
      width: 260
      height: 100
      data:
        title: 输入与已验证上下文
        type: start
        desc: ''
        selected: false
        variables:
        - variable: context_ref
          label: 服务端请求上下文
          type: paragraph
          required: true
          max_length: 12000
          options: []
        - variable: query
          label: 用户目标
          type: paragraph
          required: false
          max_length: 12000
          options: []
        - variable: arguments
          label: 业务参数 JSON
          type: paragraph
          required: false
          max_length: 12000
          options: []
      positionAbsolute:
        x: 0
        y: 200
    - id: request
      type: custom
      sourcePosition: right
      targetPosition: left
      position:
        x: 310
        y: 200
      width: 260
      height: 100
      data:
        title: 构造商品筛选参数
        type: code
        desc: ''
        selected: false
        code: "import json\ndef main(arguments: str) -> dict:\n    args = json.loads(arguments\
          \ or '{}')\n    if not isinstance(args,dict): raise ValueError('arguments必须是JSON对象')\n\
          \    return {'result':json.dumps({'operation':'products','arguments':args},ensure_ascii=False)}"
        code_language: python3
        variables:
        - variable: arguments
          value_selector:
          - start
          - arguments
          value_type: string
        outputs:
          result:
            type: string
            children: null
      positionAbsolute:
        x: 310
        y: 200
    - id: http
      type: custom
      sourcePosition: right
      targetPosition: left
      position:
        x: 620
        y: 200
      width: 260
      height: 100
      data:
        title: 调用已授权业务工具
        type: http-request
        desc: ''
        selected: false
        method: post
        url: '{{#env.TOOL_BASE_URL#}}/tools/read'
        authorization:
          type: api-key
          config:
            type: bearer
            api_key: '{{#env.TOOL_SERVICE_KEY#}}'
        headers: 'Content-Type:application/json

          X-Context-Ref:{{#start.context_ref#}}'
        params: ''
        body:
          type: json
          data:
          - type: text
            key: ''
            value: '{{#request.result#}}'
        timeout:
          connect: 5
          read: 15
          write: 5
        retry_config:
          retry_enabled: false
          max_retries: 0
          retry_interval: 1000
      positionAbsolute:
        x: 620
        y: 200
    - id: end
      type: custom
      sourcePosition: right
      targetPosition: left
      position:
        x: 930
        y: 200
      width: 260
      height: 100
      data:
        title: 返回任务结果
        type: end
        desc: ''
        selected: false
        outputs:
        - variable: result
          value_selector:
          - http
          - body
          value_type: string
      positionAbsolute:
        x: 930
        y: 200
    edges:
    - id: start-request
      type: custom
      source: start
      sourceHandle: source
      target: request
      targetHandle: target
      data:
        sourceType: start
        targetType: code
        isInIteration: false
        isInLoop: false
    - id: request-http
      type: custom
      source: request
      sourceHandle: source
      target: http
      targetHandle: target
      data:
        sourceType: code
        targetType: http-request
        isInIteration: false
        isInLoop: false
    - id: http-end
      type: custom
      source: http
      sourceHandle: source
      target: end
      targetHandle: target
      data:
        sourceType: http-request
        targetType: end
        isInIteration: false
        isInLoop: false
    viewport:
      x: 0
      y: 0
      zoom: 0.7
